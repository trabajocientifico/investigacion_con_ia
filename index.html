<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corpus de estado del arte · De la pregunta a las fuentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════════════════
     SISTEMA DE COLOR
     Cada escena declara --accent, --a2 y --wash en su propio <svg>. Todo lo
     demás lee esas variables, así que cambiar el tema de una escena reti&ntilde;e
     texto, flechas, barras y logos sin tocar una sola clase.
     El color no decora: dice en qué momento de la actividad estás.
       cian  · 01 la ecuación     ámbar · 02 los metadatos
       lila  · 03 el consolidado  verde · 04 el árbol
       coral · 05 el mapa
       índigo · la portada, el riesgo y el cierre
     ══════════════════════════════════════════════════════════════════════════ */
  :root{
    --cream:#F5F0E6; --slate:#93A7C0; --leaf:#4ADE80;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  .scene{--accent:#FBBF24; --a2:#38BDF8; --wash:#FBBF2426}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05080F;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
  #deck{width:100vw;height:100vh}
  .scene{width:100vw;height:100vh;display:none;cursor:pointer}
  .scene.active{display:block}

  /* ---------- tipografía ----------
     Todo va en caja normal, con mayúscula inicial. Las versalitas forzadas por
     `text-transform` hacían que cada rótulo se leyera como un grito y que las
     frases largas parecieran un descuido; el peso lo llevan el tamaño, el color
     y el interletrado, no la caja. */
  .term{font-size:42px;font-weight:600;letter-spacing:.06em;fill:var(--cream)}
  .sup{font-size:11px;letter-spacing:.24em;fill:var(--slate)}
  .term-rule{stroke:var(--accent);stroke-width:2.5}
  .kw{font-size:19px;font-weight:600;letter-spacing:.18em;fill:var(--accent);
      opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease}
  .kw.on{opacity:1;transform:none}
  .tag{font-size:10.5px;letter-spacing:.16em;fill:var(--slate);transition:fill .8s ease}
  .tag.hot{fill:var(--accent)}
  .tag.ok{fill:var(--leaf)}
  .tag.ink{fill:var(--cream);stroke:none}
  .val{font-size:11px;letter-spacing:.1em;fill:var(--slate)}
  .cita{font-size:11px;letter-spacing:.08em;fill:var(--slate)}
  .line{font-size:15px;letter-spacing:.05em;fill:var(--cream)}
  .big{font-size:26px;letter-spacing:.06em;fill:var(--slate)}
  .qbig{font-size:17px;letter-spacing:.05em;fill:var(--cream)}
  .tick{fill:var(--slate);opacity:.3;transition:opacity .5s,fill .5s}
  .tick.on{fill:var(--accent);opacity:1}
  .pager{font-size:10px;letter-spacing:.24em;fill:var(--slate);opacity:.75}

  /* ---------- estado ---------- */
  .fade{opacity:0;transition:opacity 1.3s ease}
  .fade.on{opacity:1}
  .dim,.fade.on.dim{opacity:.28;transition:opacity 1s ease}
  .draw{stroke-dasharray:var(--len,1000);stroke-dashoffset:var(--len,1000);
        transition:stroke-dashoffset 3.4s cubic-bezier(.4,0,.3,1)}
  .draw.on{stroke-dashoffset:0}

  /* ---------- logos ----------
     Reposo en blanco tenue, `.act` en crema, `.foc` en el color de la escena. */
  .logo .mark{fill:none;stroke:rgba(255,255,255,.42);stroke-width:2.2;
              stroke-linecap:round;stroke-linejoin:round;transition:stroke .8s ease}
  .logo .markF{fill:rgba(255,255,255,.42);stroke:none;transition:fill .8s ease}
  .logo.act .mark{stroke:var(--cream)}    .logo.act .markF{fill:var(--cream)}
  .logo.foc .mark{stroke:var(--accent)}   .logo.foc .markF{fill:var(--accent)}

  /* ---------- bucles permanentes ---------- */
  .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
  .glow{animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.30}50%{opacity:1}}
  .travel{animation:travel 4.6s ease-in-out infinite}
  @keyframes travel{0%{transform:translateX(0);opacity:0}
    12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--tx,80px));opacity:0}}
  .scan{animation:scan 5.6s ease-in-out infinite}
  @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:.9}
    90%{opacity:.9}100%{transform:translateX(var(--tx,240px));opacity:0}}

  /* ---------- personaje ---------- */
  .ink{fill:none;stroke:var(--cream);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .coat{fill:rgba(255,255,255,.10);stroke:var(--cream);stroke-width:2.4;stroke-linejoin:round}
  .legL,.legR,.armFree,.armTool,.torso{transform-box:fill-box}
  .legL,.legR{transform-origin:50% 0%}
  .armFree{transform-origin:90% 5%}
  .armTool{transform-origin:8% 6%;transform:rotate(14deg);
           transition:transform 2.2s cubic-bezier(.35,.8,.25,1)}
  .armTool.up{transform:rotate(-30deg)}
  .torso{transform-origin:50% 100%}
  .sci .torso{animation:breathe 6s ease-in-out infinite}
  .tool{fill:rgba(255,255,255,.10);stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
  .toolG{transform-box:fill-box;transform-origin:70% 60%}
  .shade{fill:#000;opacity:.42}

  /* ---------- elementos gráficos ---------- */
  .axis{stroke:rgba(255,255,255,.32);stroke-width:1.4}
  .tile{fill:rgba(255,255,255,.075);stroke:var(--cream);stroke-width:1.8;
        transition:fill .9s ease,stroke .9s ease}
  .tileHot{fill:var(--wash);stroke:var(--accent);stroke-width:2.2}
  .arrow{fill:none;stroke:var(--accent);stroke-width:2.2}
  .box{fill:none;stroke:rgba(255,255,255,.24);stroke-width:1.4;stroke-dasharray:8 9}
  .panel{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.18)}
  .panelHot{fill:var(--wash);stroke:var(--accent)}
  .edge{fill:none;stroke:rgba(255,255,255,.30);stroke-width:1.3}
  .stem{fill:none;stroke:var(--leaf);stroke-width:4.6;stroke-linecap:round;opacity:.8}

  .ui{position:fixed;bottom:20px;right:24px;display:flex;gap:8px;
      opacity:0;pointer-events:none;transition:opacity .4s ease}
  body.show-ui .ui{opacity:1;pointer-events:auto}
  .ui button{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    color:#93A7C0;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:2px;
    padding:8px 11px;cursor:pointer;transition:color .2s,border-color .2s}
  .ui button:hover{color:#fff;border-color:#fff}
  .ui button:focus-visible{outline:2px solid #fff;outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms !important;animation:none !important}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="ui">
  <button id="prev" type="button">Atrás</button>
  <button id="next" type="button">Siguiente</button>
  <button id="replay" type="button">Repetir</button>
</div>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   NÚCLEO COMPARTIDO
   ══════════════════════════════════════════════════════════════════════════ */
const NS='http://www.w3.org/2000/svg';
const deck=document.getElementById('deck');
const W=1000,H=562;

function el(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  if(attrs) for(const k in attrs) n.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function txt(parent,cls,x,y,s,extra){
  const t=el('text',Object.assign({class:cls,x:x,y:y},extra||{}),parent);
  t.textContent=s; return t;
}
const seeded=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const stagger=(nodes,step,start)=>nodes.forEach((n,i)=>n.style.transitionDelay=((start||0)+i*step).toFixed(2)+'s');
const on=(n,v)=>n.classList.toggle('on',!!v);

/* ---------- la paleta por escena ----------
   `ac` acento, `a2` segundo acento, `bg` el fondo, `wash` el relleno
   translúcido del acento (hex de 8 dígitos: no depende de color-mix). */
const TEMAS={
  indigo:{ac:'#93ABFF',a2:'#4ADE80',bg:'#0C1029',wash:'#93ABFF26'},
  leaf:  {ac:'#4ADE80',a2:'#38BDF8',bg:'#07201A',wash:'#4ADE8026'},
  amber: {ac:'#FBBF24',a2:'#FB7185',bg:'#20170A',wash:'#FBBF2426'},
  cyan:  {ac:'#38BDF8',a2:'#4ADE80',bg:'#071B28',wash:'#38BDF826'},
  violet:{ac:'#B69BFF',a2:'#38BDF8',bg:'#140F2C',wash:'#B69BFF26'},
  coral: {ac:'#FB7185',a2:'#FBBF24',bg:'#22111B',wash:'#FB718526'}
};
const NEUTRO='#101728';   /* para las escenas que muestran los cinco momentos */
const HUE={cyan:'#38BDF8',amber:'#FBBF24',violet:'#B69BFF',leaf:'#4ADE80',coral:'#FB7185'};
/* el color de cada momento de la actividad, en orden */
const ETAPAS=['cyan','amber','violet','leaf','coral'];

const tema=(svg,t)=>svg.setAttribute('style',
  '--accent:'+t.ac+';--a2:'+t.a2+';--wash:'+t.wash);

/* ---------- el fondo ----------
   Plano a propósito: un color sólido por escena, la barra del canto y la línea
   de cabecera. Nada de degradados ni halos — el color vive en las fichas, los
   rótulos y los datos, que es lo que pide una presentación proyectada.
   `franjas` parte la barra del canto en cinco tramos y hace de leyenda. */
function fondo(svg,i,t,opts){
  opts=opts||{};
  el('rect',{x:0,y:0,width:W,height:H,fill:opts.bg||t.bg},svg);

  if(opts.franjas){
    const fh=H/opts.franjas.length;
    opts.franjas.forEach((c,k)=>el('rect',{x:0,y:(k*fh).toFixed(1),width:6,
      height:fh.toFixed(1),fill:c},svg));
  }else{
    el('rect',{x:0,y:0,width:6,height:H,fill:t.ac},svg);
  }

  el('rect',{x:34,y:131,width:926,height:1,fill:'#FFFFFF',opacity:.13},svg);
}

function chrome(svg,cfg,idx,total){
  txt(svg,'sup',34,52,cfg.sup);
  txt(svg,'term',34,96,cfg.term);
  if(cfg.term) el('line',{class:'term-rule',x1:36,y1:114,x2:122,y2:114},svg);
  const kw=txt(svg,'kw',34,530,'');
  const ticks=cfg.kws.map((_,i)=>el('rect',{class:'tick',x:898+i*22,y:524,width:14,height:2.5,rx:1},svg));
  txt(svg,'pager',966,52,String(idx+1).padStart(2,'0')+' / '+String(total).padStart(2,'0'),{'text-anchor':'end'});
  if(cfg.momento){
    txt(svg,'tag hot',966,80,'Momento 0'+cfg.momento,{'text-anchor':'end'});
    for(let k=0;k<5;k++)
      el('rect',{x:848+k*24,y:92,width:16,height:3,rx:1.5,
        fill:k===cfg.momento-1?HUE[ETAPAS[k]]:'rgba(255,255,255,.18)'},svg);
  }
  return function(beat){
    kw.classList.remove('on'); kw.getBoundingClientRect();
    kw.textContent=cfg.kws[beat]||'';
    requestAnimationFrame(()=>kw.classList.add('on'));
    ticks.forEach((t,i)=>on(t,i<=beat));
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   COMPONENTES
   ══════════════════════════════════════════════════════════════════════════ */

/* ---------- registro de logos ----------
   Cada dibujante trabaja en una caja de 24×24. Nada de <text> dentro.
   `wos`, `scopus`, `tos`, `gear` y `bibx` son glifos descriptivos, no
   reproducciones de marca; el rótulo de al lado los nombra. */
const LOGOS={
  claude(g){
    for(let k=0;k<8;k++){
      const a=k*Math.PI/4, r0=2.2, r1=k%2?7.4:10.4;
      el('path',{class:'mark',style:'stroke-width:2.6',
        d:'M'+(12+r0*Math.cos(a)).toFixed(1)+','+(12+r0*Math.sin(a)).toFixed(1)+
          ' L'+(12+r1*Math.cos(a)).toFixed(1)+','+(12+r1*Math.sin(a)).toFixed(1)},g);
    }
  },
  openai(g){
    let d='';
    for(let k=0;k<6;k++){
      const a=(k*60+30)*Math.PI/180;
      d+=(k?' L':'M')+(12+10*Math.cos(a)).toFixed(1)+','+(12+10*Math.sin(a)).toFixed(1);
    }
    el('path',{class:'mark',d:d+' Z'},g);
    el('path',{class:'mark',d:'M12,12 L12,2 M12,12 L3.3,17 M12,12 L20.7,17'},g);
  },
  gemini(g){
    el('path',{class:'markF',d:'M12,1.4 C13.1,7.6 16.4,10.9 22.6,12 '+
      'C16.4,13.1 13.1,16.4 12,22.6 C10.9,16.4 7.6,13.1 1.4,12 C7.6,10.9 10.9,7.6 12,1.4 Z'},g);
  },
  /* web of science · una red de citación cerrada sobre sí misma */
  wos(g){
    el('circle',{class:'mark',cx:12,cy:12,r:9.6},g);
    el('path',{class:'mark',d:'M12,3.2 L4.4,16.8 M12,3.2 L19.6,16.8 M4.4,16.8 L19.6,16.8'},g);
    [[12,3.2],[4.4,16.8],[19.6,16.8]].forEach(p=>
      el('circle',{class:'markF',cx:p[0],cy:p[1],r:2.3},g));
  },
  /* scopus · el arco abierto con su punto */
  scopus(g){
    el('path',{class:'mark',d:'M18.4,5.2 A9.4,9.4 0 1 0 18.4,18.8'},g);
    el('circle',{class:'markF',cx:19.4,cy:12,r:2.7},g);
  },
  /* bases abiertas · el acceso sin llave */
  abierto(g){
    el('rect',{class:'mark',x:4,y:11,width:16,height:11,rx:2},g);
    el('path',{class:'mark',d:'M8,11 V7.5 A4,4 0 0 1 16,7.5'},g);
  },
  /* algoritmo propio · el engranaje */
  gear(g){
    el('circle',{class:'mark',cx:12,cy:12,r:4.3},g);
    for(let k=0;k<8;k++){
      const a=k*Math.PI/4;
      el('path',{class:'mark',
        d:'M'+(12+6.2*Math.cos(a)).toFixed(1)+','+(12+6.2*Math.sin(a)).toFixed(1)+
          ' L'+(12+9.6*Math.cos(a)).toFixed(1)+','+(12+9.6*Math.sin(a)).toFixed(1)},g);
    }
  },
  /* tree of science · raíz, tronco y hojas */
  tos(g){
    el('path',{class:'mark',style:'stroke-width:2.6',d:'M12,21 V8.5'},g);
    el('path',{class:'mark',d:'M12,13 L6.6,8.4 M12,13 L17.4,8.4 M12,8.8 L8.8,4.4 M12,8.8 L15.2,4.4'},g);
    el('path',{class:'mark',d:'M12,21 L7,23 M12,21 L17,23 M12,21 L12,23.4'},g);
  },
  /* bibliometrix · barras */
  bibx(g){
    el('path',{class:'mark',d:'M3.5,21 H21'},g);
    el('path',{class:'markF',d:'M5,21 V13 H8 V21 Z M10.5,21 V7 H13.5 V21 Z M16,21 V15 H19 V21 Z'},g);
  },
  /* red de citación */
  red(g){
    el('path',{class:'mark',d:'M6,6.5 L17.5,10 M6,6.5 L10,17.5 M17.5,10 L10,17.5 M17.5,10 L20,19'},g);
    [[6,6.5],[17.5,10],[10,17.5],[20,19]].forEach(p=>
      el('circle',{class:'markF',cx:p[0],cy:p[1],r:2.3},g));
  },
  /* artículo científico */
  paper(g){
    el('path',{class:'mark',d:'M5,2.5 H14.5 L19,7 V21.5 H5 Z M14.5,2.5 V7 H19'},g);
    el('path',{class:'mark',d:'M8,11.5 H16 M8,15 H16 M8,18.5 H13'},g);
  },
  /* prompt reusable · el bloque de instrucción */
  prompt(g){
    el('rect',{class:'mark',x:3,y:5,width:18,height:14,rx:2},g);
    el('path',{class:'mark',d:'M6.5,9.5 L9.5,12 L6.5,14.5 M12,15 H17.5'},g);
  },
  rstudio(g){
    el('path',{class:'mark',style:'stroke-width:3',
      d:'M5,21 V3 H13 A4.6,4.6 0 0 1 13,12.2 H5 M12.6,12.2 L19,21'},g);
  },
  base(g){
    [6,12,18].forEach(cy=>el('ellipse',{class:'mark',cx:12,cy:cy,rx:8,ry:3.2},g));
    el('path',{class:'mark',d:'M4,6 V18 M20,6 V18'},g);
  }
};

function marca(parent,id,x,y,s){
  s=s===undefined?1:s;
  const g=el('g',{class:'logo act',transform:'translate('+x+','+y+') scale('+s+')'},parent);
  (LOGOS[id]||LOGOS.base)(g);
  return g;
}

/* logo + nombre. `foco(true)` lo pasa al color de la escena */
function herramienta(parent,x,y,id,etiqueta){
  const g=el('g',null,parent);
  const lg=marca(g,id,x,y-14,.75);
  const tx=txt(g,'tag ink',x+26,y+4,etiqueta);
  return {g,logo:lg,label:tx,
    foco(v){
      lg.classList.toggle('foc',!!v); lg.classList.toggle('act',!v);
      tx.classList.toggle('hot',!!v); tx.classList.toggle('ink',!v);
    }};
}

function makeSci(parent,x,base,tool,scale){
  const s=scale||1;
  const g=el('g',{class:'sci',transform:'translate('+x+','+base+') scale('+s+')'},parent);
  el('ellipse',{class:'shade',cx:0,cy:4,rx:26,ry:6},g);
  const legL=el('g',{class:'legL'},g); el('path',{class:'ink',d:'M-6,-52 L-12,-2'},legL);
  const legR=el('g',{class:'legR'},g); el('path',{class:'ink',d:'M6,-52 L12,-2'},legR);
  const torso=el('g',{class:'torso'},g);
  el('path',{class:'coat',d:'M-20,-50 L-15,-104 L15,-104 L20,-50 Z'},torso);
  const af=el('g',{class:'armFree'},torso); el('path',{class:'ink',d:'M-14,-97 L-32,-64'},af);
  el('circle',{cx:0,cy:-122,r:14,fill:'rgba(255,255,255,.10)',stroke:'var(--cream)','stroke-width':2.4},torso);
  el('path',{d:'M-14,-126 a14,14 0 0 1 28,0 l4,-9 a18,18 0 0 0 -36,0 Z',fill:'var(--cream)'},torso);
  const armTool=el('g',{class:'armTool'},torso);
  el('path',{class:'ink',d:'M14,-97 L34,-70'},armTool);
  const toolG=el('g',{class:'toolG',transform:'translate(34,-70)'},armTool);
  if(tool==='hoja'){
    el('rect',{class:'tool',x:-2,y:-14,width:24,height:32,rx:2},toolG);
    for(let k=0;k<4;k++) el('line',{x1:3,y1:-7+k*8,x2:17,y2:-7+k*8,
      stroke:'rgba(255,255,255,.5)','stroke-width':1.4},toolG);
  }
  return {g,torso,armTool,toolG};
}

function makeCard(parent,x,y,w,title,lines){
  const h=44+lines.length*26;
  const g=el('g',{class:'fade'},parent);
  el('rect',{class:'panel',x:x,y:y,width:w,height:h,rx:3},g);
  if(title) txt(g,'tag hot',x+18,y+26,title);
  lines.forEach((s,i)=>txt(g,'line',x+18,y+58+i*26,s));
  return {g,h};
}

function flecha(parent,x1,y1,x2,y2,cls){
  const g=el('g',null,parent), c=cls||'arrow';
  el('path',{class:c,d:'M'+x1+','+y1+' L'+x2+','+y2},g);
  const a=Math.atan2(y2-y1,x2-x1), L=9, w=.45;
  el('path',{class:c,d:'M'+x2+','+y2+' L'+(x2-L*Math.cos(a-w)).toFixed(1)+','+(y2-L*Math.sin(a-w)).toFixed(1)},g);
  el('path',{class:c,d:'M'+x2+','+y2+' L'+(x2-L*Math.cos(a+w)).toFixed(1)+','+(y2-L*Math.sin(a+w)).toFixed(1)},g);
  return g;
}
function flechaFade(parent,x1,y1,x2,y2,cls,etiqueta){
  const g=el('g',{class:'fade'},parent);
  flecha(g,x1,y1,x2,y2,cls);
  if(etiqueta) txt(g,'tag',(x1+x2)/2,Math.min(y1,y2)-10,etiqueta,{'text-anchor':'middle'});
  return g;
}

/* ══════════════════════════════════════════════════════════════════════════
   ESCENAS
   ══════════════════════════════════════════════════════════════════════════ */

/* ============ 00 · PORTADA ============ */
function slidePortada(svg,idx,total){
  const t=TEMAS.indigo; tema(svg,t);
  fondo(svg,idx,t);

  const titulo=el('g',{class:'fade'},svg);
  txt(titulo,'term',90,232,'Corpus de');
  txt(titulo,'term',90,290,'estado del arte');
  el('line',{class:'term-rule',x1:92,y1:322,x2:240,y2:322},titulo);
  txt(titulo,'qbig',92,362,'De la pregunta a las fuentes');

  const autor=el('g',{class:'fade'},svg);
  txt(autor,'qbig',92,420,'Oscar Iván Vargas Pineda');

/* ============ 10 · MÉTODOS VALIDADOS ============
   El argumento de fondo: ninguna pieza del flujo es una caja negra ni una
   herramienta de moda. Todas están publicadas y son citables. */
function slideValidacion(svg,idx,total){
  const t=TEMAS.leaf; tema(svg,t);
  fondo(svg,idx,t,{bg:NEUTRO,franjas:ETAPAS.map(k=>HUE[k])});
  txt(svg,'qbig',120,164,'Métodos ya validados por la literatura, no herramientas de moda');

  const POS=[[110,192],[516,192],[110,344],[516,344]];
  const CIT=[
    ['El origen','Nació en la Universidad Nacional',
     'Robledo, Osorio & López (2014)','Revista Vínculos, 11(2), 6–16'],
    ['La consolidación','Grafos para analizar referencias',
     'Zuluaga, Robledo, Osorio-Zuluaga et al. (2016)','Nova, 13(25), 121–138'],
    ['La mejora','SAP afina la clasificación',
     'Valencia-Hernández et al. (2020)','Ingeniería e Investigación, 40(1), 45–49'],
    ['El mapa','La ciencia cartografiada en R',
     'Aria & Cuccurullo (2017)','Journal of Informetrics, 11(4), 959–975']

  const cards=CIT.map(function(d,k){

    const x=POS[k][0], y=POS[k][1];

    const r=el('rect',{class:'panel',x:x+10,y:y,width:374,height:132,rx:3},g);
    marca(g,'paper',x+340,y+16,.78);
    txt(g,'tag hot',x+28,y+28,d[0]);
    txt(g,'line',x+28,y+62,d[1]);
    txt(g,'cita',x+28,y+94,d[2]);
    txt(g,'cita',x+28,y+114,d[3]);
    return {g,r};
  });

  const cierre=el('g',{class:'fade'},svg);
  txt(cierre,'tag ok',112,504,'Y el reporte del proceso sigue PRISMA 2020 · Page et al. (2021), BMJ 372, n71');

  const setKw=chrome(svg,{sup:'El respaldo · literatura indexada',term:'Validación',
    kws:['El origen','La consolidación','La mejora','El mapa']},idx,total);

  return function(beat){
    cards.forEach(function(c,k){
      /* aquí no atenuamos: el argumento es que las cuatro citas se lean */
      on(c.g,k<=beat);
      c.g.style.transitionDelay=(k===beat?0:.1).toFixed(2)+'s';
      c.r.classList.toggle('panelHot',k===beat);

    on(cierre,beat>=3);
    setKw(beat);

}

/* ══════════════════════════════════════════════════════════════════════════
   MOTOR DEL MAZO
   ══════════════════════════════════════════════════════════════════════════ */
const DEFS=[slidePortada,slideRiesgo,slideResultado,slideRuta,slideEcuacion,
            slideMetadatos,slideConsolidar,slideArbol,slideMapa,
            slideEvaluacion,slideValidacion,slideCierre];
const BEATS=4;
const slides=DEFS.map(function(fn,i){
  const svg=el('svg',{class:'scene',viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMidYMid meet'},deck);
  const render=fn(svg,i,DEFS.length);
  return {svg,render,beat:0,beats:render.beats||BEATS};
});
let cur=0;
function show(i,beat){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.svg.classList.toggle('active',k===cur));
  slides[cur].beat=beat===undefined?0:Math.max(0,Math.min(slides[cur].beats-1,beat));
  slides[cur].render(slides[cur].beat);
}
function next(){
  const s=slides[cur];
  if(s.beat<s.beats-1){s.beat++;s.render(s.beat);}
  else if(cur<slides.length-1) show(cur+1,0);
}
function back(){
  const s=slides[cur];
  if(s.beat>0){s.beat--;s.render(s.beat);}
  else if(cur>0) show(cur-1,slides[cur-1].beats-1);
}
document.getElementById('next').onclick=e=>{e.stopPropagation();next();};
document.getElementById('prev').onclick=e=>{e.stopPropagation();back();};
document.getElementById('replay').onclick=e=>{e.stopPropagation();show(cur,0);};
deck.onclick=next;
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();back();}
  else if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();show(cur+1,0);}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();show(cur-1,0);}
  else if(e.key==='r'||e.key==='R'){show(cur,0);}
  else if(/^[0-9]$/.test(e.key)){
    const n=e.key==='0'?10:+e.key;
    if(n<=slides.length) show(n-1,0);
  }
});
let uiT;
const showUI=()=>{document.body.classList.add('show-ui');clearTimeout(uiT);
  uiT=setTimeout(()=>document.body.classList.remove('show-ui'),2600);};
addEventListener('pointermove',showUI); addEventListener('focusin',showUI);

function desdeHash(){
  const m=/^#(\d+),(\d+)$/.exec(location.hash);
  if(m) show(+m[1],+m[2]); else show(0,0);
}
addEventListener('hashchange',desdeHash);
desdeHash();
